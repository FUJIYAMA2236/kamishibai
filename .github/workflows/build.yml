# デスクトップアプリを Windows / macOS / Linux 向けにビルドする（GitHub の Actions タブから手動で、またはタグ v* を push したとき）。
# できたインストーラーなどは、実行結果の「Artifacts」からダウンロードできる。
name: build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest
          - os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux の前提ライブラリ
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm test
      - run: npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: kamishibai-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/**
            src-tauri/target/release/kamishibai.exe
          if-no-files-found: ignore
